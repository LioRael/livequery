name: macOS deadline diagnosis
on:
  workflow_dispatch:
    inputs:
      measurement_runner:
        description: 'ARM measurement capacity; xlarge requires an eligible organization and billing authorization'
        type: choice
        options: [macos-26, macos-26-xlarge]
        default: macos-26
        required: true
permissions:
  contents: read
concurrency:
  group: macos-deadline-diagnosis
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/diagnostics/macos.py prepare --seconds 300
      - name: Build official and explicitly instrumented binaries
        run: |
          cargo build --release --locked --manifest-path target/ci-offcpu/official-source/experiments/workload/Cargo.toml
          cargo build --release --locked --manifest-path target/ci-offcpu/source/experiments/workload/Cargo.toml
          rustc -Vv > target/ci-offcpu/toolchain.txt
          python3 scripts/diagnostics/macos.py package --seconds 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deadline-binaries-${{ github.sha }}
          path: |
            target/ci-offcpu/bin
            target/ci-offcpu/build-manifest.json
            target/ci-offcpu/provenance.json
            target/ci-offcpu/toolchain.txt
            target/ci-offcpu/instrumentation.patch
          if-no-files-found: error
          retention-days: 30
  measure:
    needs: build
    runs-on: ${{ inputs.measurement_runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [official, diagnostic]
        engine: [sync, async]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Isolate indexing on this disposable measurement VM
        run: |
          sudo mdutil -a -i off
          mdutil -a -s
          python3 scripts/diagnostics/quiet-hosted-macos.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: deadline-binaries-${{ github.sha }}
          path: target/ci-offcpu
      - name: Fixed VM settling interval (no CPU admission gate)
        run: sleep 180
      - name: Measure original workload and enforce original error gates
        run: python3 scripts/diagnostics/macos.py run --seconds 300 --variant '${{ matrix.variant }}' --engine '${{ matrix.engine }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos26-${{ matrix.variant }}-${{ matrix.engine }}-${{ github.sha }}
          path: |
            target/ci-offcpu/*.json
            target/ci-offcpu/*.txt
            target/ci-offcpu/*.patch
            target/ci-offcpu/sync
            target/ci-offcpu/async
          if-no-files-found: error
          retention-days: 30
