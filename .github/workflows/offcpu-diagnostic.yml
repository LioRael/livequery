name: macOS deadline diagnosis
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/offcpu-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: macos-deadline-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare isolated diagnostic source
        run: python3 scripts/diagnostics/macos.py prepare --seconds 300
      - name: Build before measurements
        run: cargo build --release --locked --manifest-path target/ci-offcpu/source/experiments/workload/Cargo.toml
      - name: Record toolchain
        run: rustc -Vv > target/ci-offcpu/toolchain.txt
      - name: Serial measurements with original error gates
        run: python3 scripts/diagnostics/macos.py run --seconds 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos-deadline-diagnosis-${{ github.sha }}
          path: |
            target/ci-offcpu/*.json
            target/ci-offcpu/*.txt
            target/ci-offcpu/*.patch
            target/ci-offcpu/sync
            target/ci-offcpu/async
          if-no-files-found: error
          retention-days: 30
