name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test -p livequery-core --features serde_json/arbitrary_precision,serde_json/raw_value
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/consumer-check.py
      - run: cargo build --workspace --bins --locked
      - run: python3 scripts/smoke.py
      - run: python3 scripts/jobs-smoke.py
      - run: cargo build --manifest-path tests/registry-consumer/Cargo.toml --locked
        if: runner.os == 'Linux'
      - run: cargo install livequery-cli --version 0.1.0-alpha.4 --locked --root target/registry-install
        if: runner.os == 'Linux'
      - run: python3 scripts/jobs-smoke.py --cli target/registry-install/bin/livequery --host tests/registry-consumer/target/debug/livequery-registry-jobs
        if: runner.os == 'Linux'
      - run: python3 scripts/jobs-smoke.py --host tests/registry-consumer/target/debug/livequery-registry-jobs
        if: runner.os == 'Linux'
      - run: cargo build --manifest-path tests/compat-alpha2/Cargo.toml --locked
        if: runner.os == 'Linux'
      - run: cargo install livequery-cli --version 0.1.0-alpha.2 --locked --root target/compat-install
        if: runner.os == 'Linux'
      - run: python3 scripts/protocol-compat.py
        if: runner.os == 'Linux'
      - run: cargo build --release --manifest-path experiments/workload/Cargo.toml --locked
      - run: python3 scripts/workload-smoke.py
      - run: python3 scripts/benchmark-service.py --task-rows 1000 --string-bytes 128 --seconds 30 --repeats 1 --output target/task-smoke.json
      - run: python3 scripts/check-load.py target/task-smoke.json --min-seconds 30
      - run: cargo package -p livequery-core -p livequery-derive -p livequery-query -p livequery-transport -p livequery-agent -p livequery -p livequery-cli --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace --locked
      - run: cargo run --manifest-path tests/consumer/Cargo.toml --locked
      - run: cargo run --manifest-path tests/components/Cargo.toml --locked
