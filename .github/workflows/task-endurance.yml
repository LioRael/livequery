name: Task-table endurance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task-endurance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path experiments/workload/Cargo.toml --locked
      - name: Package exact measurement binary and toolchain
        run: |
          mkdir -p target/ci-bin
          cp experiments/workload/target/release/livequery-workload target/ci-bin/livequery-workload
          rustc -Vv > target/ci-bin/toolchain.txt
          git rev-parse HEAD >> target/ci-bin/toolchain.txt
      - name: Hash all measurement executables
        run: |
          cd target/ci-bin
          shasum -a 256 livequery-workload > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: task-endurance-binary-${{ matrix.os }}-${{ github.sha }}
          path: target/ci-bin
          if-no-files-found: error
          retention-days: 30
  task-table:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        engine: [sync, async]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: task-endurance-binary-${{ matrix.os }}-${{ github.sha }}
          path: target/ci-bin
      - name: Verify build artifacts without compiling on the measurement VM
        run: |
          cd target/ci-bin
          shasum -a 256 -c SHA256SUMS
          chmod +x livequery-workload
      - name: Preserve toolchain and measurement host identity
        run: |
          cp target/ci-bin/toolchain.txt target/task-toolchain.txt
          uname -a >> target/task-toolchain.txt
          python3 -c 'import json,os,platform,sys; print(json.dumps({"os":platform.platform(),"arch":platform.machine(),"cpus":os.cpu_count(),"image":os.environ.get("ImageVersion"),"python":sys.version}))' >> target/task-toolchain.txt
      - name: Linux endurance and acceptance gates
        run: bash scripts/task-endurance.sh '${{ matrix.engine }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: task-endurance-${{ matrix.os }}-${{ matrix.engine }}-${{ github.sha }}
          path: |
            target/task-*.json
            target/task-toolchain.txt
            target/ci-bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
