[package]
name = "livequery-workload"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
[workspace]
[features]
default = ["inspection", "async"]
inspection = ["dep:livequery"]
async = ["dep:tokio"]
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
livequery = { path = "../../crates/livequery", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util"], optional = true }
